name: CI/CD Pipeline

on:
  pull_request:
    branches:
      - dev
      - qa
      - main

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout do código
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Configurar Node.js para Cypress
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      # 3. Instalar dependências do projeto
      - name: Install dependencies
        run: npm install

      # 4. Executar testes Cypress
      - name: Run Cypress tests
        run: npx cypress run
        env:
          CI: true