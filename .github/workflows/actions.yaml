name: CI/CD Pipeline

on:
  pull_request:
    branches:
      - dev
      - qa
      - main

jobs:
  run-tests:
    runs-on: ubuntu-latest
    if: github.event.pull_request.base.ref == 'dev' || github.event.pull_request.base.ref == 'qa' || github.event.pull_request.base.ref == 'main'

    steps:
      # 1. Exibir mensagem inicial
      - name: Start CI/CD Pipeline
        run: echo "Iniciando pipeline de CI/CD para a branch ${{ github.event.pull_request.base.ref }}"

      # 2. Checkout do código
      - name: Checkout code
        uses: actions/checkout@v3

      # 3. Configurar Node.js para Cypress
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      # 4. Instalar dependências do Cypress
      - name: Install dependencies
        run: npm install

      # 5. Executar testes Cypress
      - name: Run Cypress tests
        run: npx cypress run
        env:
          CI: true